# Configuration of the click2call microservice.
# This file is the conffile of the ivozprovider-click2call package. On install,
# the postinst sets db.password (debconf ivozprovider/mysql_password) and a
# random digest.secret: with several portals nodes, set the same value on
# every node.
server:
  listen: "0.0.0.0:9090"
  # The service serves HTTPS directly. If tls_cert and tls_key are empty it
  # serves plain HTTP: for testing only (behind a proxy, the auth failure log
  # would show the proxy's IP).
  tls_cert: "/etc/ssl/certs/ivozprovider-portals.pem"
  tls_key: "/etc/ssl/private/ivozprovider-portals.key"
  # CORS origins allowed for the browser extension. "*" = any.
  allowed_origins:
    - "*"

digest:
  # Server-side HMAC key used to sign/validate the nonces (internal; never sent
  # to clients and unrelated to the SIP password). Use a long random value, e.g.:
  #   openssl rand -hex 32
  secret: "change-me-please"
  # Nonce validity in seconds.
  nonce_ttl: 30

db:
  host: "data.ivozprovider.local"
  port: 3306
  name: "ivozprovider"
  user: "root"
  password: "changeme"

ami:
  user: "ivozamiuser"
  secret: "ivozamisecret"
  port: 5038

kamailio:
  rpc_url: "http://users.ivozprovider.local:8000/RPC"

call:
  dial_timeout: 30
  max_duration: 10800000
  optimize: false

log:
  level: 4
